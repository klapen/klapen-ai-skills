<div class="gauge-lcd" style="width:100%; max-width:400px; padding:18px 20px; background:var(--bg,#000); border:1px solid var(--primary); box-shadow:inset 0 0 12px rgba(0,0,0,0.6);">
  <div style="display:flex; justify-content:space-between; align-items:baseline; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-dim, #888); margin-bottom:8px;">
    <span>RISK  //  LEVEL</span>
    <span class="lcd-value" style="color:var(--primary); font-size:22px; font-weight:700; text-shadow:0 0 8px var(--glow); letter-spacing:0.05em;">--</span>
  </div>
  <div style="height:22px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); position:relative; overflow:hidden;">
    <div class="lcd-fill" style="height:100%; width:0%; background:linear-gradient(90deg, var(--primary), var(--accent)); box-shadow:0 0 12px var(--glow); transition:width 900ms ease-out;"></div>
  </div>
  <div style="display:flex; justify-content:space-between; font-size:9px; letter-spacing:0.25em; color:var(--text-dim, #666); margin-top:6px;">
    <span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>
  </div>
</div>
