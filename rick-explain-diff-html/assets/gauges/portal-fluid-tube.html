<div class="gauge-tube" style="display:flex; gap:20px; align-items:center;">
  <div style="width:90px; height:240px; padding:8px; background:var(--bg,#000); border:2px solid var(--primary); border-radius:16px; position:relative; overflow:hidden;">
    <div style="position:absolute; inset:8px; background:rgba(255,255,255,0.03); border-radius:12px; overflow:hidden;">
      <div class="tube-fill" style="position:absolute; left:0; right:0; bottom:0; height:0%; background:linear-gradient(180deg, var(--accent), var(--primary)); box-shadow:inset 0 0 14px var(--glow), 0 0 14px var(--glow); transition:height 900ms ease-out;">
        <div style="position:absolute; top:-4px; left:0; right:0; height:6px; background:rgba(255,255,255,0.4); animation:tube-bubble 2s infinite;"></div>
      </div>
    </div>
    <style>@keyframes tube-bubble { 0%,100% { opacity:0.3; } 50% { opacity:0.8; } }</style>
  </div>
  <div style="text-align:left; font-family:inherit; letter-spacing:0.12em; text-transform:uppercase;">
    <div style="color:var(--text-dim,#888); font-size:11px; margin-bottom:4px;">PORTAL FLUID</div>
    <div style="color:var(--primary); font-size:11px;">CHARGE LEVEL</div>
    <div style="height:1px; width:110px; background:rgba(255,255,255,0.15); margin:8px 0;"></div>
    <div style="color:var(--text-dim, #888); font-size:9px;">C-137  //  DIM STABLE</div>
  </div>
</div>
