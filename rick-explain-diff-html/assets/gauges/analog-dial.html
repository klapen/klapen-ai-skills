<svg class="gauge-dial" viewBox="0 0 300 190" width="320" height="200" xmlns="http://www.w3.org/2000/svg" aria-label="Analog risk dial">
  <!-- background arc -->
  <path d="M 40 150 A 110 110 0 0 1 260 150" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="16"/>
  <!-- safe half -->
  <path d="M 40 150 A 110 110 0 0 1 150 40" fill="none" stroke="var(--primary)" stroke-width="6" opacity="0.55"/>
  <!-- danger half -->
  <path d="M 150 40 A 110 110 0 0 1 260 150" fill="none" stroke="var(--danger, #ff5f5f)" stroke-width="6" opacity="0.55"/>
  <!-- ticks -->
  <g stroke="var(--text-dim, #888)" stroke-width="1">
    <line x1="40"  y1="150" x2="50"  y2="150"/>
    <line x1="70"  y1="80"  x2="80"  y2="87"/>
    <line x1="150" y1="40"  x2="150" y2="52"/>
    <line x1="230" y1="80"  x2="220" y2="87"/>
    <line x1="260" y1="150" x2="250" y2="150"/>
  </g>
  <!-- labels -->
  <text x="40"  y="175" fill="var(--primary)" font-family="inherit" font-size="11" text-anchor="middle" letter-spacing="1">SAFE</text>
  <text x="150" y="30"  fill="var(--accent)"  font-family="inherit" font-size="11" text-anchor="middle" letter-spacing="1">RISK</text>
  <text x="260" y="175" fill="var(--danger, #ff5f5f)"  font-family="inherit" font-size="11" text-anchor="middle" letter-spacing="1">DOOM</text>
  <!-- needle -->
  <g class="dial-needle" transform="rotate(-90 150 150)">
    <line x1="150" y1="150" x2="150" y2="55" stroke="var(--primary)" stroke-width="4"
          style="filter: drop-shadow(0 0 6px var(--glow));"/>
    <circle cx="150" cy="150" r="9" fill="var(--primary)"
            style="filter: drop-shadow(0 0 6px var(--glow));"/>
    <circle cx="150" cy="150" r="3" fill="var(--bg, #000)"/>
  </g>
</svg>
