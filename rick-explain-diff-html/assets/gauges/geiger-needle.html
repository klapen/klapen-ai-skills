<svg class="gauge-geiger" viewBox="0 0 320 220" width="340" height="230" xmlns="http://www.w3.org/2000/svg" aria-label="Geiger counter needle">
  <!-- outer bezel -->
  <rect x="10" y="10" width="300" height="200" fill="var(--bg,#000)" stroke="var(--primary)" stroke-width="2.5" rx="10"/>
  <!-- inner display -->
  <rect x="20" y="20" width="280" height="150" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="6"/>
  <!-- background arc -->
  <path d="M 60 165 A 100 100 0 0 1 260 165" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="14"/>
  <!-- safe zone -->
  <path d="M 60 165 A 100 100 0 0 1 160 65" fill="none" stroke="var(--primary)" stroke-width="5" opacity="0.65"/>
  <!-- danger zone -->
  <path d="M 160 65 A 100 100 0 0 1 260 165" fill="none" stroke="var(--danger, #ff5f5f)" stroke-width="5" opacity="0.65"/>
  <!-- tick labels -->
  <text x="60"  y="185" fill="var(--primary)" font-family="inherit" font-size="10" text-anchor="middle" letter-spacing="1">0</text>
  <text x="160" y="55"  fill="var(--accent)"  font-family="inherit" font-size="10" text-anchor="middle" letter-spacing="1">50</text>
  <text x="260" y="185" fill="var(--danger, #ff5f5f)" font-family="inherit" font-size="10" text-anchor="middle" letter-spacing="1">100</text>
  <!-- needle -->
  <g class="geiger-needle" transform="rotate(-60 160 165)">
    <line x1="160" y1="165" x2="160" y2="75" stroke="var(--primary)" stroke-width="3"
          style="filter: drop-shadow(0 0 5px var(--glow));"/>
    <circle cx="160" cy="165" r="7" fill="var(--primary)"
            style="filter: drop-shadow(0 0 5px var(--glow));"/>
    <circle cx="160" cy="165" r="2.5" fill="var(--bg,#000)"/>
  </g>
  <!-- footer label INSIDE bezel, below display -->
  <text x="160" y="195" fill="var(--text-dim, #888)" font-family="inherit" font-size="11" text-anchor="middle" letter-spacing="3">GEIGER  //  C-137</text>
</svg>
