<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="DNA helix">
  <path d="M 60 15 Q 140 55 60 95 Q 140 135 60 175" fill="none" stroke="currentColor" stroke-width="2.5"/>
